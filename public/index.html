<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>TWOT AI — Ultimate SMC Trader (Persistent + Calibrate + Debug)</title>
  <style>
    :root{--bg:#0f172a;--card:rgba(30,41,59,.78);--muted:#94a3b8;--accent:#3b82f6;--good:#10b981;--bad:#ef4444;--warn:#f59e0b}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,Segoe UI,Arial;background:linear-gradient(135deg,var(--bg) 0%,#1e293b 100%);color:#eef2ff;padding:18px}
    .container{max-width:1200px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    h1{font-size:1.1rem;background:linear-gradient(90deg,#3b82f6,#10b981);-webkit-background-clip:text;color:transparent}
    .controls{display:flex;gap:8px;align-items:center}
    select,input,button{padding:8px 10px;border-radius:8px;background:#0b1220;border:1px solid rgba(255,255,255,.06);color:#eef2ff}
    button{cursor:pointer}
    .card{background:var(--card);padding:14px;border-radius:10px;margin-bottom:12px;border:1px solid rgba(255,255,255,.04)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:640px){.grid{grid-template-columns:1fr}}
    .pred{padding:10px;border-radius:8px;background:rgba(255,255,255,.02);border-left:6px solid #64748b}
    .pred.buy{border-left-color:var(--good);background:rgba(16,185,129,.06)}
    .pred.sell{border-left-color:var(--bad);background:rgba(239,68,68,.06)}
    .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .tag{font-size:.75rem;padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.04)}
    .small{font-size:.85rem;color:var(--muted)}
    .progress{height:8px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
    .bar{height:100%;background:var(--accent);width:0;transition:width .3s}
    .actions{display:flex;gap:8px;margin-top:8px}
    .btn{padding:6px 8px;border-radius:8px;border:none}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-good{background:var(--good);color:#04270f}
    .btn-bad{background:var(--bad);color:#fff}
    .debug-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    textarea{width:100%;height:120px;background:#071022;color:#eef2ff;border:1px solid rgba(255,255,255,.04);padding:8px;border-radius:8px}
    .muted{color:var(--muted);font-size:.85rem}
    .table{width:100%;border-collapse:collapse}
    .table td{padding:6px;border-bottom:1px solid rgba(255,255,255,.03)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TWOT AI — Ultimate SMC Trader</h1>
      <div class="controls">
        <select id="symbol"><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option></select>
        <select id="tf"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option><option value="1h">1h</option></select>
        <button id="run" class="btn btn-primary">Generate Predictions</button>
        <button id="reset" class="btn">Reset</button>
      </div>
    </header>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>Live</strong> <span id="status" class="small">connecting...</span></div>
        <div id="price" class="small">—</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><strong>Predictions (no HOLDs)</strong><div class="small">Every output is BUY or SELL — scored and risk-managed</div></div>
        <div class="small" id="lastRun">Idle</div>
      </div>

      <div id="predictions" class="grid">
        <div class="small">Press Generate to create predictions</div>
      </div>

      <div style="margin-top:10px">
        <div class="progress"><div id="prog" class="bar"></div></div>
        <div class="small" id="progText">progress 0%</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <strong>SMC Analysis</strong>
        <div id="analysis" class="small">No analysis yet</div>
      </div>

      <div class="card">
        <strong>Risk</strong>
        <div id="risk" class="small">No active trade</div>
      </div>

      <div class="card">
        <strong>Learning & Debug</strong>
        <div class="muted" style="margin-bottom:6px">Pattern weights and quick tools</div>
        <div id="debugPanel">
          <div class="debug-row">
            <button id="showWeights" class="btn">Show Weights</button>
            <button id="calibrate" class="btn btn-primary">Run Calibration</button>
            <button id="export" class="btn">Export Weights</button>
            <button id="importBtn" class="btn">Import Weights</button>
            <button id="persist" class="btn">Persist to Server</button>
          </div>
          <div id="weightsArea" style="margin-top:8px;display:none">
            <table class="table" id="weightsTable"></table>
            <div style="margin-top:8px"><textarea id="importExport" placeholder="Paste JSON to import or see exported JSON here"></textarea></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/*
  Changes compared to previous:
  - Client interacts with server persistence endpoints:
      GET  /api/weights        -> load persisted weights + marketBias + history
      POST /api/weights        -> save weights object
      POST /api/history       -> append rated entries
      GET  /api/history       -> get rated history used by calibrator
      POST /api/calibrate     -> run server-side calibration routine (returns new weights)
  - Client also keeps localStorage fallback if server unavailable
  - Debug panel to view/export/import/persist weights + run calibration
  - Calibration algorithm is a simple weighted adjustment using labeled history (server also runs same logic)
*/

class PersistentSMC {
  constructor() {
    this.API_BASE = '/api';
    this.symbolEl = document.getElementById('symbol');
    this.tfEl = document.getElementById('tf');
    this.runBtn = document.getElementById('run');
    this.resetBtn = document.getElementById('reset');
    this.predContainer = document.getElementById('predictions');
    this.analysisEl = document.getElementById('analysis');
    this.learningEl = document.getElementById('debugPanel');
    this.riskEl = document.getElementById('risk');
    this.statusEl = document.getElementById('status');
    this.priceEl = document.getElementById('price');
    this.prog = document.getElementById('prog');
    this.progText = document.getElementById('progText');
    this.lastRun = document.getElementById('lastRun');

    this.showWeightsBtn = document.getElementById('showWeights');
    this.calibrateBtn = document.getElementById('calibrate');
    this.exportBtn = document.getElementById('export');
    this.importBtn = document.getElementById('importBtn');
    this.persistBtn = document.getElementById('persist');
    this.weightsArea = document.getElementById('weightsArea');
    this.weightsTable = document.getElementById('weightsTable');
    this.importExport = document.getElementById('importExport');

    this.livePrice = null;
    this.isConnected = false;
    this.predictions = [];
    this.history = []; // local rated history copy

    // Learning state: default pattern weights
    this.weights = {
      patternWeights: { orderBlock:1, fvg:1, liquidity:1, volume:1, rsi:1, macd:1, stoch:1, momentum:1, priceAction:1 },
      contextWeights: { uptrend:1, downtrend:1, ranging:1 },
      marketBias: 0
    };

    this.setup();
  }

  setup() {
    this.runBtn.addEventListener('click', ()=>this.generateBatch());
    this.resetBtn.addEventListener('click', ()=>this.resetAll());
    this.showWeightsBtn.addEventListener('click', ()=>this.toggleWeights());
    this.calibrateBtn.addEventListener('click', ()=>this.runCalibration());
    this.exportBtn.addEventListener('click', ()=>this.exportWeights());
    this.importBtn.addEventListener('click', ()=>this.importWeights());
    this.persistBtn.addEventListener('click', ()=>this.saveWeightsToServer());

    this.attemptLoadWeights();
    this.tryConnect();
  }

  async tryConnect(){
    try {
      const t = await this.fetchJSON('/proxy/time').catch(()=>null);
      this.isConnected = true;
      this.updateStatus('connected');
      await this.updatePrice();
      setInterval(()=>this.updatePrice().catch(()=>{}),4000);
    } catch {
      this.isConnected = false;
      this.updateStatus('offline — using local fallback');
      this.mockPrice();
    }
  }

  updateStatus(s){ this.statusEl.textContent = s; }

  async fetchJSON(path, opts={}) {
    const res = await fetch(path, opts);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async attemptLoadWeights(){
    // Try server first
    try {
      const payload = await this.fetchJSON(`${this.API_BASE}/weights`);
      if(payload && payload.patternWeights){
        this.weights = payload;
        this.saveWeightsLocal();
        this.renderWeightsTable();
        this.appendHistoryLocal(payload.history || []);
        return;
      }
    } catch(e){ /* ignore server failure and load local */ }

    // Load from localStorage fallback
    const raw = localStorage.getItem('twot_weights_v1');
    if(raw){
      try {
        const w = JSON.parse(raw);
        this.weights = w;
        this.renderWeightsTable();
      } catch(e){}
    } else {
      this.saveWeightsLocal();
      this.renderWeightsTable();
    }
  }

  saveWeightsLocal(){
    try { localStorage.setItem('twot_weights_v1', JSON.stringify(this.weights)); } catch(e){}
  }

  async saveWeightsToServer(){
    try {
      const res = await fetch(`${this.API_BASE}/weights`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(this.weights) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j = await res.json();
      this.updateStatus('weights persisted');
      return j;
    } catch(e){
      this.updateStatus('persist failed — server unavailable');
      return null;
    }
  }

  appendHistoryLocal(items){
    if(!Array.isArray(items)) return;
    items.forEach(it => this.history.unshift(it));
    if(this.history.length>500) this.history.splice(500);
  }

  updatePrice(){
    return this.fetchJSON(`/proxy/ticker?symbol=${this.symbolEl.value}`).then(d=>{
      const p = Number(d.price);
      if(isFinite(p)){ this.livePrice = p; this.priceEl.textContent = `${this.symbolEl.value} $${p.toFixed(2)}`; } else this.mockPrice();
    }).catch(()=>this.mockPrice());
  }

  mockPrice(){ if(!this.livePrice) this.livePrice = 45000; const c=(Math.random()-0.5)*50; this.livePrice=Math.max(1,this.livePrice+c); this.priceEl.textContent = `${this.symbolEl.value} $${this.livePrice.toFixed(2)} (sim)`; }

  setProgress(p){ this.prog.style.width = Math.max(0,Math.min(100,p))+'%'; this.progText.textContent = 'progress '+Math.round(p)+'%'; }

  // Batch generation (uses same SMC ensemble local function)
  async generateBatch(){
    if(this._running) return;
    this._running = true;
    this.predContainer.innerHTML = '';
    this.setProgress(0);
    this.lastRun.textContent = 'running...';

    let klines=[];
    try {
      klines = await this.fetchJSON(`/proxy/klines?symbol=${this.symbolEl.value}&interval=${this.tfEl.value}&limit=240`);
      if(Array.isArray(klines) && Array.isArray(klines[0])) {
        klines = klines.map(k=>({time:k[0],open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}));
      }
    } catch(e){
      klines = this.simulateKlines(240);
    }

    const batch = [];
    for(let i=0;i<5;i++){
      this.setProgress(i*18);
      await this.delay(200+Math.random()*200);
      const sample = this.sliceKlines(klines,i);
      const analysis = this.smcAnalysis(sample);
      const book = await this.tryFetchDepth().catch(()=>null);
      const spreadPenalty = this.computeSpreadPenalty(book);
      const pred = this.makePrediction(analysis, spreadPenalty, i+1, sample);
      this.renderPrediction(pred);
      batch.push(pred);
      this.predictions.push(pred);
    }
    this.setProgress(100);
    this.lastRun.textContent = new Date().toLocaleTimeString();
    this.appendHistoryLocal(batch);
    this._running = false;
  }

  sliceKlines(klines, idx){
    const n=120; const shift = Math.min(30, idx*4);
    const start=Math.max(0, klines.length - n - shift);
    return klines.slice(start, start+n).map(k=>({...k}));
  }

  simulateKlines(limit=120){
    const out=[]; let p=this.livePrice||45000; const now=Date.now();
    for(let i=0;i<limit;i++){ const ch=(Math.random()-0.5)*100; const open=p; p=Math.max(1,p+ch); const close=p; const high=Math.max(open,close)+Math.random()*30; const low=Math.min(open,close)-Math.random()*30; out.push({time:now-(limit-i)*60000,open,high,low,close,volume:200+Math.random()*1000}); }
    return out;
  }

  tryFetchDepth(){ return this.fetchJSON(`/proxy/depth?symbol=${this.symbolEl.value}&limit=50`); }

  computeSpreadPenalty(book){
    if(!book || !book.bids || !book.asks) return 0;
    const bestBid = (Array.isArray(book.bids) && book.bids[0]) ? +book.bids[0][0] : null;
    const bestAsk = (Array.isArray(book.asks) && book.asks[0]) ? +book.asks[0][0] : null;
    if(!isFinite(bestBid) || !isFinite(bestAsk) || bestAsk <= bestBid) return 0;
    const rel = (bestAsk-bestBid)/((bestAsk+bestBid)/2);
    return Math.min(0.25, rel);
  }

  // SMC analysis (same ensemble as before)
  smcAnalysis(klines){
    const closes = klines.map(k=>k.close), highs=klines.map(k=>k.high), lows=klines.map(k=>k.low);
    const recent = klines.slice(-120);
    const ema20 = this.ema(closes,20), ema50=this.ema(closes,50).fast||ema20, ema200=this.ema(closes,200).fast||ema50;
    const momentum = this.momentum(closes), rsi=this.rsi(closes,14), macd=this.macd(closes), stoch=this.stochastic(klines,14), atr=this.atr(klines,14);
    const vol=this.volumeProfile(klines), orderBlocks=this.findOrderBlocks(klines), fvg=this.findFVG(klines);
    const liquidity = { above: Math.max(...highs.slice(-120)), below: Math.min(...lows.slice(-120)) };

    let score=0, reasons=[], patterns=[];
    const W = this.weights.patternWeights;

    // Price action
    const pa = this.priceAction(klines);
    if(pa.direction==='bullish'){ score += 28 * (W.priceAction||1); reasons.push('bullish price action'); patterns.push('priceAction'); }
    if(pa.direction==='bearish'){ score -= 28 * (W.priceAction||1); reasons.push('bearish price action'); patterns.push('priceAction'); }

    for(const ob of orderBlocks){
      const dist = Math.abs((ob.high+ob.low)/2 - closes[closes.length-1]) / closes[closes.length-1];
      if(dist<0.015){ const s=(ob.type==='bullish'?20:-20)*(W.orderBlock||1); score+=s; reasons.push(ob.type+' order block'); patterns.push('orderBlock'); }
    }

    for(const g of fvg){ if(closes[closes.length-1]>=g.bottom && closes[closes.length-1]<=g.top){ const s=(g.type==='bullish'?12:-12)*(W.fvg||1); score+=s; reasons.push(g.type+' FVG'); patterns.push('fvg'); } }

    const curr=closes[closes.length-1];
    if(Math.abs(liquidity.above - curr)/curr < 0.01){ score -= 16 * (W.liquidity||1); reasons.push('near upper liquidity'); patterns.push('liquidity'); }
    if(Math.abs(curr - liquidity.below)/curr < 0.01){ score += 16 * (W.liquidity||1); reasons.push('near lower liquidity'); patterns.push('liquidity'); }

    if(vol.direction==='bullish' && vol.strength>35){ score+=12*(W.volume||1); reasons.push('bullish volume'); patterns.push('volume'); }
    if(vol.direction==='bearish' && vol.strength>35){ score-=12*(W.volume||1); reasons.push('bearish volume'); patterns.push('volume'); }

    if(rsi<30){ score+=12*(W.rsi||1); reasons.push('oversold RSI'); patterns.push('rsi'); }
    if(rsi>70){ score-=12*(W.rsi||1); reasons.push('overbought RSI'); patterns.push('rsi'); }

    if(macd.histogram>0){ score+=8*(W.macd||1); patterns.push('macd'); }
    if(macd.histogram<0){ score-=8*(W.macd||1); patterns.push('macd'); }

    if(stoch.k<20){ score+=6*(W.stoch||1); patterns.push('stoch'); }
    if(stoch.k>80){ score-=6*(W.stoch||1); patterns.push('stoch'); }

    const context = this.marketContext(klines);
    if((context.context==='uptrend' && score>0) || (context.context==='downtrend' && score<0)){
      score *= 1.12 * (this.weights.contextWeights[context.context]||1);
      reasons.push('trend alignment');
    }

    score += momentum * (W.momentum||1) * 1.5;
    score = Math.max(-100, Math.min(100, score));

    return { score, reasons, patterns: Array.from(new Set(patterns)), context, rsi, macd, stoch, atr, vol, current: curr, klineSample:klines };
  }

  // Indicator & SMC helpers (same as previous file)
  ema(arr,period){ const v=arr.filter(isFinite); if(v.length<period) return {fast:v[v.length-1]||0, slow:v[v.length-1]||0}; const mul=2/(period+1); let ema=v.slice(0,period).reduce((a,b)=>a+b,0)/period; for(let i=period;i<v.length;i++) ema=(v[i]-ema)*mul+ema; return {fast:ema, slow:0}; }
  rsi(closes,period=14){ if(closes.length<period+1) return 50; let gains=0,losses=0; for(let i=1;i<=period;i++){ const d=closes[closes.length-i]-closes[closes.length-i-1]; if(d>0) gains+=d; else losses-=d; } let avgG=gains/period, avgL=losses/period; for(let i=closes.length-period;i<closes.length-1;i++){ const change=closes[i+1]-closes[i]; if(change>0){ avgG=(avgG*(period-1)+change)/period; avgL=(avgL*(period-1))/period; } else { avgG=(avgG*(period-1))/period; avgL=(avgL*(period-1)-change)/period; } } if(avgL===0) return 100; const rs=avgG/avgL; return Math.max(0,Math.min(100,100-(100/(1+rs)))); }
  macd(closes){ if(closes.length<26) return {macdLine:0,signalLine:0,histogram:0}; const e12=this.ema(closes,12).fast, e26=this.ema(closes,26).fast; const macdLine=e12-e26; const signal=macdLine*0.8; return { macdLine, signalLine:signal, histogram: macdLine-signal }; }
  stochastic(klines,period=14){ if(klines.length<period) return {k:50,d:50}; const recent=klines.slice(-period); const hh=Math.max(...recent.map(r=>r.high)), ll=Math.min(...recent.map(r=>r.low)); if(hh===ll) return {k:50,d:50}; const k=((recent[recent.length-1].close-ll)/(hh-ll))*100; return {k, d:this.ema(recent.map(r=>r.close),3).fast}; }
  atr(klines,period=14){ if(klines.length<period+1) return (this.livePrice||45000)*0.01; let sum=0; for(let i=klines.length-period;i<klines.length;i++){ const high=klines[i].high, low=klines[i].low, prev=klines[i-1].close; sum+=Math.max(high-low, Math.abs(high-prev), Math.abs(low-prev)); } return sum/period; }
  momentum(closes){ if(closes.length<10) return 0; const recent=closes.slice(-5).reduce((a,b)=>a+b,0)/5; const prev=closes.slice(-10,-5).reduce((a,b)=>a+b,0)/5; return ((recent-prev)/prev)*100; }
  volumeProfile(klines){ const recent=klines.slice(-20); let buy=0,sell=0; for(const c of recent){ if(c.close>c.open) buy+=c.volume; else sell+=c.volume; } const total=buy+sell; if(total===0) return {strength:0,direction:'neutral'}; const buyPct=(buy/total)*100; return {strength:Math.abs(50-buyPct)*2,direction:buyPct>60?'bullish':buyPct<40?'bearish':'neutral', buyPct}; }
  priceAction(klines){ const recent=klines.slice(-10); let bull=0,bear=0,total=0; for(const c of recent){ const body=Math.abs(c.close-c.open), range=(c.high-c.low)||1; const str=(body/range)*100; total+=str; if(c.close>c.open) bull++; else bear++; } const avg=total/recent.length; return {strength:avg, direction: bull>bear+1?'bullish':bear>bull+1?'bearish':'neutral'}; }
  findOrderBlocks(klines){ const blocks=[]; for(let i=2;i<klines.length-1;i++){ const cur=klines[i-1], nxt=klines[i]; if(!cur||!nxt) continue; const curBody=Math.abs(cur.close-cur.open), nxtBody=Math.abs(nxt.close-nxt.open); if(cur.close<cur.open && nxt.close>nxt.open && nxtBody>curBody*1.5) blocks.push({type:'bullish',high:cur.high,low:cur.low,time:cur.time,strength:this.blockStrength(cur,nxt)}); else if(cur.close>cur.open && nxt.close<nxt.open && nxtBody>curBody*1.5) blocks.push({type:'bearish',high:cur.high,low:cur.low,time:cur.time,strength:this.blockStrength(cur,nxt)}); } return blocks.slice(-8); }
  blockStrength(a,b){ try{ const bs=Math.abs(a.high-a.low)||1; return Math.min(100,(Math.abs(b.close-b.open)/bs)*50);}catch{return 50;} }
  findFVG(klines){ const gaps=[]; for(let i=1;i<klines.length-1;i++){ const prev=klines[i-1], next=klines[i+1]; if(prev.high < next.low) gaps.push({type:'bullish', bottom:prev.high, top:next.low, time:klines[i].time}); if(prev.low > next.high) gaps.push({type:'bearish', bottom:next.high, top:prev.low, time:klines[i].time}); } return gaps.slice(-6); }
  marketContext(klines){ if(!klines||klines.length<50) return {context:'ranging',strength:0,momentum:0}; try{ const closes=klines.map(k=>k.close); const ema50=this.ema(closes,50).fast, ema200=this.ema(closes,200).fast || ema50; const curr=closes[closes.length-1]; const pE50=((curr-ema50)/ema50)*100; const e50e200=((ema50-ema200)/ema200)*100; const momentum=this.momentum(closes); let ctx='ranging', str=0; if(pE50>0.7 && e50e200>0.4 && momentum>0){ ctx='uptrend'; str=Math.min(100,Math.abs(pE50)+Math.abs(momentum*8)); } else if(pE50<-0.7 && e50e200<-0.4 && momentum<0){ ctx='downtrend'; str=Math.min(100,Math.abs(pE50)+Math.abs(momentum*8)); } else { ctx='ranging'; str=Math.max(0,50 - Math.abs(momentum*20)); } return {context:ctx,strength:Math.max(0,Math.min(100,str)), momentum}; }catch(e){return {context:'ranging',strength:0,momentum:0}; }

  // Prediction maker: NO HOLD
  makePrediction(analysis, spreadPenalty, sequence, sample){
    const spreadPenaltyPts = (spreadPenalty||0)*100;
    let adj = analysis.score - spreadPenaltyPts*0.6;
    adj = adj*(1 - Math.abs(this.weights.marketBias)/500) + (this.weights.marketBias/10);
    const volTilt = (analysis.vol.direction==='bullish'?1:analysis.vol.direction==='bearish'?-1:0)*(analysis.vol.strength||0)/60;
    const momentumTilt = (analysis.context.momentum||0)*0.6;
    const final = adj + volTilt*6 + momentumTilt*4;
    let confidence = 50 + (final/2);
    confidence += (sequence-3)*2 + (Math.random()-0.5)*6;
    confidence = Math.max(30, Math.min(90, Math.round(confidence*10)/10));
    const type = final >= 0 ? 'BUY' : 'SELL';
    const atr = analysis.atr || (this.livePrice||45000)*0.01;
    const entry = analysis.current || this.livePrice || 0;
    const stop = type==='BUY' ? entry - atr*1.2 : entry + atr*1.2;
    const target = type==='BUY' ? entry + atr*2.6 : entry - atr*2.6;
    const rr = type==='BUY' ? ((target-entry)/(entry-stop)) : ((entry-target)/(stop-entry));
    const riskReward = Math.max(0.5, Math.min(10, Math.round(rr*10)/10));
    return { id:Date.now()+'-'+sequence, symbol:this.symbolEl.value, timeframe:this.tfEl.value, type, confidence, entry:+entry.toFixed(2), stop:+stop.toFixed(2), target:+target.toFixed(2), riskReward, analysis, created:Date.now() };
  }

  renderPrediction(pred){
    const wrap=document.createElement('div'); wrap.className='pred '+(pred.type==='BUY'?'buy':'sell');
    wrap.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong>${pred.type}</strong> <span class="small">· ${pred.confidence}%</span></div>
        <div class="small">${new Date(pred.created).toLocaleTimeString()}</div>
      </div>
      <div class="small" style="margin-top:6px">Entry: $${pred.entry} • Stop: $${pred.stop} • Target: $${pred.target}</div>
      <div class="tags small">${pred.analysis.reasons.slice(0,3).map(r=>`<span class="tag">${this.escape(r)}</span>`).join('')}</div>
      <div class="actions">
        <button class="btn btn-good" data-id="${pred.id}">Correct</button>
        <button class="btn btn-bad" data-id="${pred.id}">Wrong</button>
      </div>
    `;
    this.predContainer.appendChild(wrap);
    wrap.querySelector('.btn-good').addEventListener('click', ()=>this.onFeedback(pred.id,'Success'));
    wrap.querySelector('.btn-bad').addEventListener('click', ()=>this.onWrong(pred.id));
  }

  // Feedback: onSuccess reinforce, onWrong prompt correction and adapt
  async onFeedback(id,outcome){
    const pred = this.findPred(id);
    if(!pred) return;
    pred.outcome = outcome; pred.outcomeTime = Date.now();
    this.reinforcePatterns(pred.analysis.patterns, true);
    this.appendRatedToServer(pred, outcome);
    this.saveWeightsLocal();
    this.saveWeightsToServer().catch(()=>{});
    this.updateDebugNote(`Recorded success for ${pred.type} @ ${pred.entry}`);
  }

  async onWrong(id){
    const pred = this.findPred(id);
    if(!pred) return;
    const actual = prompt(`so i was wrong about this one — this is the feedback. What was actual direction? Enter BUY or SELL:`, pred.type==='BUY'?'SELL':'BUY');
    if(!actual) { alert('Feedback cancelled'); return; }
    const up = actual.toUpperCase().trim(); if(up!=='BUY' && up!=='SELL'){ alert('Enter BUY or SELL only'); return; }
    pred.correctedType = up; pred.outcome = 'Corrected'; pred.outcomeTime = Date.now();
    const msg = `so i was wrong about this one: predicted ${pred.type} but actual was ${up}. Saving that and learning from it.`;
    this.updateDebugNote(msg);
    // penalize patterns, adjust marketBias
    this.adjustForCorrection(pred, up);
    this.appendRatedToServer(pred, up);
    this.saveWeightsLocal();
    await this.saveWeightsToServer().catch(()=>{ this.updateDebugNote('Persist failed — server offline'); });
    // run client-side quick recalibration (server calibration available separately)
    this.recalibrateLocal();
  }

  findPred(id){ return this.predictions.find(p=>p.id===id) || this.history.find(p=>p.id===id); }

  reinforcePatterns(patterns, good){
    for(const p of patterns){ if(this.weights.patternWeights[p]===undefined) this.weights.patternWeights[p]=1; this.weights.patternWeights[p] = Math.max(0.25, Math.min(3, this.weights.patternWeights[p] * (good?1.08:0.92))); }
  }

  adjustForCorrection(pred, actual){
    for(const p of pred.analysis.patterns){ if(this.weights.patternWeights[p]!==undefined) this.weights.patternWeights[p] = Math.max(0.25, this.weights.patternWeights[p]*0.82); }
    if(actual==='BUY') this.weights.marketBias = Math.min(100, (this.weights.marketBias||0)+12); else this.weights.marketBias = Math.max(-100, (this.weights.marketBias||0)-12);
  }

  recalibrateLocal(){
    // normalize pattern weights: keep spread but avoid runaway
    const keys=Object.keys(this.weights.patternWeights); let sum=0; for(const k of keys) sum+=this.weights.patternWeights[k]; const avg=sum/keys.length||1;
    for(const k of keys) this.weights.patternWeights[k] = Math.max(0.25, Math.min(3, this.weights.patternWeights[k] * (1/avg) * 0.95 + this.weights.patternWeights[k]*0.05));
    this.renderWeightsTable();
  }

  async runCalibration(){
    // ask server to calibrate (preferred) — server runs batch optimization on labeled history if available; fallback to local light calibration
    try {
      const res = await fetch(`${this.API_BASE}/calibrate`, { method:'POST' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const j = await res.json();
      if(j.weights){ this.weights = j.weights; this.saveWeightsLocal(); this.renderWeightsTable(); this.updateDebugNote('Calibration completed on server'); return; }
    } catch(e){
      // fallback to client calibration using local history
      this.clientCalibrate();
    }
  }

  clientCalibrate(){
    // Simple calibration: For each pattern, increase weight if it correlates with success, decrease if correlates with failure.
    const counts = {}; // { pattern: {pos: n, neg: m} }
    for(const h of this.history){
      if(!h.analysis || !h.analysis.patterns) continue;
      const ok = (h.outcome === 'Success' || h.outcome === 'Corrected' && h.correctedType === h.type) ? 1 : (h.outcome === 'Corrected' ? 0 : (h.outcome === 'Fail' ? -1 : 0));
      for(const p of h.analysis.patterns){
        counts[p] = counts[p] || {pos:0,neg:0,total:0}; counts[p].total++;
        if(h.outcome === 'Success') counts[p].pos++;
        if(h.outcome === 'Corrected') counts[p].neg++;
      }
    }
    // adjust weights moderately based on ratio
    for(const p in this.weights.patternWeights){
      const c = counts[p] || {pos:0,neg:0,total:0};
      const delta = (c.pos - c.neg) / Math.max(1, c.total); // range -1..1
      this.weights.patternWeights[p] = Math.max(0.25, Math.min(3, this.weights.patternWeights[p] * (1 + delta*0.18)));
    }
    this.recalibrateLocal();
    this.updateDebugNote('Local calibration completed');
  }

  async appendRatedToServer(pred, rating){
    // store rated entry to server history (server appends if endpoint available)
    try {
      await fetch(`${this.API_BASE}/history`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(pred) });
      this.updateDebugNote('Rated entry sent to server history');
    } catch(e){
      this.updateDebugNote('Failed to append rated entry to server — offline, saved locally');
    }
    this.history.unshift(pred);
    if(this.history.length>500) this.history.splice(500);
  }

  exportWeights(){
    const json = JSON.stringify(this.weights, null, 2);
    this.importExport.value = json;
    this.updateDebugNote('Weights exported to text area');
  }

  importWeights(){
    const raw = this.importExport.value.trim();
    if(!raw) { alert('Paste JSON into textarea first'); return; }
    try {
      const w = JSON.parse(raw);
      if(w.patternWeights){ this.weights = w; this.saveWeightsLocal(); this.renderWeightsTable(); this.updateDebugNote('Weights imported'); } else alert('Invalid weights JSON');
    } catch(e){ alert('Invalid JSON'); }
  }

  renderWeightsTable(){
    this.weightsArea.style.display='block';
    let html = '<tr><td><strong>Pattern</strong></td><td><strong>Weight</strong></td></tr>';
    for(const k in this.weights.patternWeights) html += `<tr><td>${k}</td><td>${this.weights.patternWeights[k].toFixed(3)}</td></tr>`;
    html += `<tr><td>marketBias</td><td>${(this.weights.marketBias||0).toFixed(1)}</td></tr>`;
    this.weightsTable.innerHTML = html;
  }

  updateDebugNote(msg){
    const area = document.getElementById('importExport');
    if(area) area.value = `${new Date().toLocaleTimeString()} • ${msg}\n\n${area.value}`.slice(0, 2000);
  }

  // small utilities
  escape(s){ return (''+s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  delay(ms){ return new Promise(r=>setTimeout(r,ms)); }
}
window.tradingAI = new PersistentSMC();
</script>
